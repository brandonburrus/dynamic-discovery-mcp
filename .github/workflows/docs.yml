name: Publish Docs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      # Install root deps so we can regenerate the JSON Schema from the Zod
      # source of truth. The generator writes to both schema/mcp-config.json
      # and docs/public/config.json, so this guarantees the docs site serves
      # the same schema bytes as the npm tarball ships, regardless of what is
      # committed in docs/public/config.json.
      - name: Install root dependencies
        run: npm ci

      - name: Regenerate JSON Schema
        run: npm run generate:schema

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs site
        working-directory: docs
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
